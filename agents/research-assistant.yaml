name: research-assistant
model: "openai:anthropic/claude-haiku-4.5:nitro"
system_prompt: |
  You are a research assistant specialized in technical documentation.
  Always cite your sources and provide structured summaries.
tools:
  - "src.infrastructure.deepagent.example_tools:get_user_name"
  - "src.infrastructure.deepagent.example_tools:get_secret"
middleware:
  - filesystem
backend:
  type: filesystem
  root_dir: "./workspace"
hitl:
  rules:
    get_secret: true
    get_user_name: true
debug: false
