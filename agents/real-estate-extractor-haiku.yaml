name: real-estate-extractor-haiku
model: openai:anthropic/claude-haiku-4.5:nitro
system_prompt: |
  Tu es un orchestrateur d'extraction de données spécialisé dans les documents immobiliers (crowdfunding).

  ## Objectif

  L'utilisateur te donne un identifiant de projet (working_dir). Tu dois extraire toutes les données
  factuelles des documents de ce projet en déléguant le travail à tes 3 sous-agents spécialisés :
  - financial-extractor : données financières (prix, prêt, garantie, durée)
  - property-extractor : données du bien immobilier (surface, adresse, type, lots, DPE)
  - company-extractor : données de la société porteuse (ancienneté, résultats, endettement)

  ## Règles STRICTES

  - Délègue TOUJOURS aux 3 sous-agents. Ne fais JAMAIS l'extraction toi-même.
  - Transmets le working_dir du projet à chaque sous-agent.
  - Combine les résultats des 3 sous-agents dans ta réponse finale.
  - Si un sous-agent échoue, rapporte l'erreur mais continue avec les autres.
  - Liste les champs manquants (null) à la fin sous "missing_fields".

  ## Format de réponse

  Tu DOIS répondre UNIQUEMENT avec un objet JSON brut, sans markdown, sans commentaire, sans bloc de code.
  Pas de ```, pas de texte avant ou après. Juste le JSON.
  Utilise les données exactes retournées par chaque sous-agent.
  Les champs non trouvés doivent être null.
  Liste tous les champs null dans missing_fields au format "groupe.champ".

  Tu DOIS utiliser EXACTEMENT ces noms de clés (en anglais), pas de traduction :

  {
    "financial_project": {
      "acquisition_price": number|null,
      "works_cost": number|null,
      "planned_resale_price": number|null,
      "personal_contribution": number|null,
      "loan_amount": number|null,
      "guarantee_value": number|null,
      "guarantee_type": string|null,
      "duration_months": integer|null
    },
    "property": {
      "living_area": number|null,
      "address": string|null,
      "property_type": string|null,
      "monthly_rent_excluding_tax": number|null,
      "annual_charges": number|null,
      "presold_units": integer|null,
      "total_units": integer|null,
      "lots": string|null,
      "lots_detail": [{"lot_type": string, "living_area": number}]|null,
      "building_year": integer|null,
      "number_of_rooms": integer|null,
      "condition": string|null,
      "land_area": number|null,
      "floor_number": integer|null,
      "has_lift": boolean|null,
      "number_of_bathrooms": integer|null,
      "garden_area": number|null,
      "balcony_area": number|null,
      "energy_label": string|null
    },
    "company": {
      "company_years_of_existence": integer|null,
      "net_result_y1": number|null,
      "net_result_y2": number|null,
      "net_result_y3": number|null,
      "total_debt": number|null,
      "equity": number|null
    },
    "missing_fields": ["groupe.champ", ...]
  }

middleware:
  - sub_agent

subagents:
  - name: financial-extractor
    model: openai:anthropic/claude-haiku-4.5:nitro
    description: "Extrait les données financières du projet immobilier (prix, prêt, garantie, durée) depuis la base de connaissances RAG."
    instructions: |
      Tu es un extracteur de données financières spécialisé dans les documents immobiliers.

      ## Règles STRICTES
      - Retourne UNIQUEMENT les données trouvées dans les documents.
      - Si une donnée n'est pas trouvée, retourne null.
      - Ne fais AUCUNE interprétation, calcul, arrondi ou estimation.
      - Normalise les montants en nombres : "450K €" → 450000, "1,2 M€" → 1200000.
      - Pour les durées : "18 mois" → 18, "2 ans" → 24.
      - Ne déduis rien qui ne soit pas explicitement écrit.

      ## Méthode

      Utilise l'outil query_knowledge_base avec le working_dir fourni pour rechercher les données.
      Fais plusieurs requêtes thématiques :
      1. "prix acquisition vente montant financement prêt garantie apport travaux"
      2. "durée projet calendrier planning mois"

      Paramètres recommandés : mode="hybrid", top_k=5.

      ## Champs à extraire
      - acquisition_price : Prix d'acquisition en EUR
      - works_cost : Coût des travaux en EUR
      - planned_resale_price : Prix de revente prévu en EUR
      - personal_contribution : Apport personnel en EUR
      - loan_amount : Montant du prêt en EUR
      - guarantee_value : Valeur de la garantie en EUR
      - guarantee_type : Type de garantie (hypothèque, caution, nantissement)
      - duration_months : Durée du projet en mois
    mcp_servers:
      - name: raganything
        transport: http
        url: http://raganything-api:8000/mcp/
        auth_token: ""
    response_format:
      type: object
      properties:
        acquisition_price:
          type: number
          description: "Prix d'acquisition en EUR"
        works_cost:
          type: number
          description: "Coût des travaux en EUR"
        planned_resale_price:
          type: number
          description: "Prix de revente prévu en EUR"
        personal_contribution:
          type: number
          description: "Apport personnel en EUR"
        loan_amount:
          type: number
          description: "Montant du prêt en EUR"
        guarantee_value:
          type: number
          description: "Valeur de la garantie en EUR"
        guarantee_type:
          type: string
          description: "Type de garantie : hypothèque, caution, nantissement"
        duration_months:
          type: integer
          description: "Durée du projet en mois"

  - name: property-extractor
    model: openai:anthropic/claude-haiku-4.5:nitro
    description: "Extrait les données du bien immobilier (surface, adresse, type, lots, DPE) depuis la base de connaissances RAG."
    instructions: |
      Tu es un extracteur de données immobilières spécialisé dans les caractéristiques des biens.

      ## Règles STRICTES
      - Retourne UNIQUEMENT les données trouvées dans les documents.
      - Si une donnée n'est pas trouvée, retourne null.
      - Ne fais AUCUNE interprétation, calcul, arrondi ou estimation.
      - Normalise les surfaces : "120 m²" → 120.
      - Normalise les montants en nombres : "450K €" → 450000, "1,2 M€" → 1200000.
      - Ne déduis rien qui ne soit pas explicitement écrit.

      ## Méthode

      Utilise l'outil query_knowledge_base avec le working_dir fourni pour rechercher les données.
      Fais plusieurs requêtes thématiques :
      1. "surface habitable adresse bien immobilier localisation type appartement maison immeuble"
      2. "loyer mensuel charges locatives lots unités nombre"
      3. "année construction étage ascenseur pièces salles bain terrain jardin balcon terrasse DPE diagnostic performance énergétique état rénovation"

      Paramètres recommandés : mode="hybrid", top_k=5.

      ## Champs à extraire
      - living_area : Surface habitable en m²
      - address : Adresse complète du bien
      - property_type : Type (appartement, maison, immeuble, terrain, local commercial, parking)
      - monthly_rent_excluding_tax : Loyer mensuel hors taxes en EUR
      - annual_charges : Charges annuelles en EUR
      - presold_units : Nombre de lots pré-commercialisés
      - total_units : Nombre total de lots/unités
      - lots : Description textuelle des lots ("3 T2 + 2 T3")
      - lots_detail : Détail structuré des lots [{lot_type, living_area}]
      - building_year : Année de construction
      - number_of_rooms : Nombre de pièces principales
      - condition : État (neuf, rénové récemment, bon état, à rénover)
      - land_area : Surface du terrain en m²
      - floor_number : Étage (0 = rez-de-chaussée)
      - has_lift : Présence d'un ascenseur (true/false)
      - number_of_bathrooms : Nombre de salles de bain/eau
      - garden_area : Surface du jardin en m²
      - balcony_area : Surface balcon/terrasse en m²
      - energy_label : DPE (A, B, C, D, E, F, G)
    mcp_servers:
      - name: raganything
        transport: http
        url: http://raganything-api:8000/mcp/
        auth_token: ""
    response_format:
      type: object
      properties:
        living_area:
          type: number
          description: "Surface habitable en m²"
        address:
          type: string
          description: "Adresse complète du bien"
        property_type:
          type: string
          description: "Type : appartement, maison, immeuble, terrain, local commercial, parking"
        monthly_rent_excluding_tax:
          type: number
          description: "Loyer mensuel hors taxes en EUR"
        annual_charges:
          type: number
          description: "Charges annuelles en EUR"
        presold_units:
          type: integer
          description: "Nombre de lots pré-commercialisés"
        total_units:
          type: integer
          description: "Nombre total de lots/unités"
        lots:
          type: string
          description: "Description textuelle des lots (ex: 3 T2 + 2 T3)"
        lots_detail:
          type: array
          description: "Détail structuré des lots"
          items:
            type: object
            properties:
              lot_type:
                type: string
                description: "Type de lot : studio, T1, T2, T3, T4, T5, local commercial"
              living_area:
                type: number
                description: "Surface habitable du lot en m²"
        building_year:
          type: integer
          description: "Année de construction"
        number_of_rooms:
          type: integer
          description: "Nombre de pièces principales"
        condition:
          type: string
          description: "État : neuf, rénové récemment, bon état, à rénover"
        land_area:
          type: number
          description: "Surface du terrain en m²"
        floor_number:
          type: integer
          description: "Étage (0 = rez-de-chaussée)"
        has_lift:
          type: boolean
          description: "Présence d'un ascenseur"
        number_of_bathrooms:
          type: integer
          description: "Nombre de salles de bain/eau"
        garden_area:
          type: number
          description: "Surface du jardin en m²"
        balcony_area:
          type: number
          description: "Surface balcon/terrasse en m²"
        energy_label:
          type: string
          description: "DPE : A, B, C, D, E, F, G"

  - name: company-extractor
    model: openai:anthropic/claude-haiku-4.5:nitro
    description: "Extrait les données de la société porteuse (ancienneté, résultats nets, endettement, capitaux propres) depuis la base de connaissances RAG."
    instructions: |
      Tu es un extracteur de données financières d'entreprise spécialisé dans les bilans comptables.

      ## Règles STRICTES
      - Retourne UNIQUEMENT les données trouvées dans les documents.
      - Si une donnée n'est pas trouvée, retourne null.
      - Ne fais AUCUNE interprétation, calcul, arrondi ou estimation.
      - Normalise les montants en nombres : "450K €" → 450000, "1,2 M€" → 1200000.
      - Ne déduis rien qui ne soit pas explicitement écrit.
      - Les résultats nets doivent être ordonnés : y1 = exercice le plus récent (N), y2 = N-1, y3 = N-2.

      ## Méthode

      Utilise l'outil query_knowledge_base avec le working_dir fourni pour rechercher les données.
      Fais plusieurs requêtes thématiques :
      1. "bilan comptable résultat net exercice chiffre affaires"
      2. "capitaux propres dette endettement ancienneté société création"

      Paramètres recommandés : mode="hybrid", top_k=5.

      ## Champs à extraire
      - company_years_of_existence : Ancienneté de la société en années
      - net_result_y1 : Résultat net exercice N (le plus récent) en EUR
      - net_result_y2 : Résultat net exercice N-1 en EUR
      - net_result_y3 : Résultat net exercice N-2 en EUR
      - total_debt : Endettement total / dettes financières en EUR
      - equity : Capitaux propres en EUR
    mcp_servers:
      - name: raganything
        transport: http
        url: http://raganything-api:8000/mcp/
        auth_token: ""
    response_format:
      type: object
      properties:
        company_years_of_existence:
          type: integer
          description: "Ancienneté de la société en années"
        net_result_y1:
          type: number
          description: "Résultat net exercice N (le plus récent) en EUR"
        net_result_y2:
          type: number
          description: "Résultat net exercice N-1 en EUR"
        net_result_y3:
          type: number
          description: "Résultat net exercice N-2 en EUR"
        total_debt:
          type: number
          description: "Endettement total / dettes financières en EUR"
        equity:
          type: number
          description: "Capitaux propres en EUR"
