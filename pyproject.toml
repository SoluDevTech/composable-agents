[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "composable-agents"
version = "0.1.0"
description = "Composable AI agents with YAML configuration, MCP tool integration, and PostgreSQL persistence"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.6.10",
    "cryptography>=48.0.1",
    "langchain-core>=1.4.7",
    "pyasn1>=0.6.3",
    "pyjwt>=2.13.0",
    "langgraph>=1.2.5",
    "requests>=2.33.0",
    "fastapi>=0.128.4",
    "langchain-mcp-adapters>=0.3.0",
    "mcp>=1.27.0",
    "langchain-openai>=1.1.15",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
    "sse-starlette>=3.2.0",
    "uvicorn[standard]>=0.40.0",
    "asyncpg>=0.30.0",
    "miniopy-async>=1.21.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "cachetools>=7.0.5",
    "arize-phoenix-otel==0.15.0",
    "openinference-instrumentation-langchain==0.1.62",
    "arize-phoenix-client==2.3.0",
    "tenacity>=8.0.0",
    # --- Security: pin above fixed versions of known CVEs (trivy) ---
    "aiohttp>=3.14.1",
    "idna>=3.15",
    "langsmith>=0.8.18",
    "mako>=1.3.12",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.30",
    "starlette>=1.3.1",
    "urllib3>=2.7.0",
]
[dependency-groups]
dev = [
    "aiosqlite>=0.20.0",
    "httpx>=0.28.1",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
